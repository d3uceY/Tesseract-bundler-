name: Build Tesseract Release

# Publishes one self-contained Tesseract archive per OS/arch, plus SHA256SUMS.
#
# Self-containment is the whole point of this repo. The consumer (vectile)
# downloads one of these archives at runtime and refuses to keep a binary it
# cannot execute, so a bundle that piggybacks on the build machine's shared
# libraries (leptonica, libicu, libtiff, ...) is useless: it installs on the
# runner and dies on a user's machine. Windows was always built static; the
# Unix jobs here are now static too.
#
# How: leptonica (and its image codecs) are built from source by vcpkg and
# linked in, instead of linking the distro's/Homebrew's shared liblept + libicu.
# Tesseract finds leptonica through `find_package(Leptonica CONFIG)`, which
# resolves against the vcpkg prefix the toolchain file sets up. Each Unix job
# then *asserts* the result has no non-system dependencies, so a regression
# fails the build instead of shipping a broken bundle.
#
# ICU is deliberately NOT installed: the Windows bundle has always been built
# without it and OCR does not need it, so leaving it out keeps all five
# archives consistent and avoids a heavy port build.
#
# vcpkg triplet note: the *-linux and *-osx default triplets already produce
# static libraries. Only Windows needs the explicit `-static` suffix.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tesseract version to build"
        required: true
        default: "5.5.3"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout bundler repo
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v5

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push triggers build the version pinned in TESSERACT_VERSION,
            # not the bundler repo's own tag name.
            echo "version=$(tr -d '[:space:]' < TESSERACT_VERSION)" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            os: windows-2025
            triplet: x64-windows-static
            archive: zip

          - platform: linux-amd64
            os: ubuntu-24.04
            triplet: x64-linux
            archive: tar.gz

          - platform: linux-arm64
            os: ubuntu-24.04-arm
            triplet: arm64-linux
            archive: tar.gz

          # macos-13 was retired by GitHub; a job on a label with no runner
          # queues until the 24h limit instead of failing fast. The supported
          # Intel labels are macos-15-intel / macos-26-intel.
          - platform: macos-amd64
            os: macos-15-intel
            triplet: x64-osx
            archive: tar.gz

          - platform: macos-arm64
            os: macos-14
            triplet: arm64-osx
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    env:
      # vcpkg lives beside the checkout, not inside it, so the Tesseract source
      # tree stays pristine. `github.workspace` is the checkout itself, so `..`
      # is the runner workspace (the `runner` context is not available in a
      # job-level `env:` block).
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      # Reuse compiled ports between runs: leptonica and its codecs build from
      # source and dominate the job time.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/../vcpkg-bincache

    steps:
      - name: Checkout Tesseract
        uses: actions/checkout@v5
        with:
          repository: tesseract-ocr/tesseract
          ref: ${{ needs.version.outputs.version }}
          submodules: recursive

      # ------------------------------------------------------------
      # Toolchain
      # ------------------------------------------------------------

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Install vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ needs.version.outputs.version }}

      # ------------------------------------------------------------
      # Dependencies (static leptonica, from source)
      # ------------------------------------------------------------

      - name: Install leptonica (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install leptonica --triplet "${{ matrix.triplet }}" --clean-after-build

      - name: Install leptonica (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install leptonica --triplet "${{ matrix.triplet }}" --clean-after-build

      # ------------------------------------------------------------
      # Build Tesseract
      # ------------------------------------------------------------

      # -A x64 must be given explicitly; the toolchain derives the default
      # triplet from the generator platform, and we only installed one triplet.
      # DISABLE_CURL/ARCHIVE keep the link line free of stray system libraries,
      # which would otherwise turn into runtime shared-library deps.
      # GRAPHICS_DISABLED drops the X11/viewer path so nothing drags in libX11.
      - name: Build Tesseract - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\package"

          cmake -S . -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" `
            -DBUILD_SHARED_LIBS=OFF `
            -DOPENMP_BUILD=OFF `
            -DBUILD_TRAINING_TOOLS=OFF `
            -DBUILD_TESTS=OFF `
            -DGRAPHICS_DISABLED=ON `
            -DDISABLE_CURL=ON `
            -DDISABLE_ARCHIVE=ON `
            -DWIN32_MT_BUILD=ON

          cmake --build build --config Release --parallel
          cmake --install build --config Release

      # Linux keeps glibc/libc dynamic (those exist everywhere) but links the
      # C++ runtime statically, so the bundle does not depend on the runner's
      # libstdc++ version. macOS links the always-present system libc++.
      - name: Build Tesseract - Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            extra+=("-DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++")
          fi

          cmake -S . -B build -G Ninja \
            "${extra[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/package" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DOPENMP_BUILD=OFF \
            -DBUILD_TRAINING_TOOLS=OFF \
            -DBUILD_TESTS=OFF \
            -DGRAPHICS_DISABLED=ON \
            -DDISABLE_CURL=ON \
            -DDISABLE_ARCHIVE=ON

          cmake --build build --parallel
          cmake --install build

      # ------------------------------------------------------------
      # Add language data
      # ------------------------------------------------------------

      - name: Download tessdata
        shell: bash
        run: |
          mkdir -p package/tessdata

          curl -L --fail --retry 3 --retry-delay 2 \
            -o package/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata

          curl -L --fail --retry 3 --retry-delay 2 \
            -o package/tessdata/osd.traineddata \
            https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata

      # ------------------------------------------------------------
      # Normalize package layout
      # ------------------------------------------------------------

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p dist/tesseract
          cp -r package/* dist/tesseract/

          # Ship a portable runtime, not a dev install: bin/ + tessdata/.
          rm -rf dist/tesseract/lib dist/tesseract/include
          rm -f dist/tesseract/bin/*.pdb

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # A static build must not depend on sibling DLLs, and leptonica
            # lives in a *static* triplet so it cannot leak a DLL in here.
            # If one ever shows up, the "static" assumption has broken and the
            # shipped package would fail on a clean machine.
            dlls=$(find dist/tesseract -iname '*.dll')
            if [[ -n "$dlls" ]]; then
              echo "::error::Unexpected DLLs in the Windows package - build is no longer self-contained:"
              echo "$dlls"
              exit 1
            fi
          fi

          echo "Package contents:"
          find dist/tesseract -maxdepth 3 -type f

      # ------------------------------------------------------------
      # Test
      # ------------------------------------------------------------

      # Runs the binary straight out of the packaged tree. Nothing from the
      # vcpkg install tree is on PATH here, so a missing shared library would
      # fail this step rather than a user's machine.
      - name: Test Tesseract
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./dist/tesseract/bin/tesseract.exe --version
            ./dist/tesseract/bin/tesseract.exe --list-langs \
              --tessdata-dir ./dist/tesseract/tessdata
          else
            ./dist/tesseract/bin/tesseract --version
            ./dist/tesseract/bin/tesseract --list-langs \
              --tessdata-dir ./dist/tesseract/tessdata
          fi

      # ------------------------------------------------------------
      # Prove self-containment
      # ------------------------------------------------------------

      # Only glibc-family system libraries are acceptable. Anything resolving
      # out of the runner's home, /opt, or a vcpkg tree means a dependency was
      # linked dynamically after all, and the bundle is not portable.
      - name: Verify self-contained (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Dynamic dependencies:"
          ldd dist/tesseract/bin/tesseract

          if ldd dist/tesseract/bin/tesseract | grep -q 'not found'; then
            echo "::error::tesseract is missing a shared library on this runner"
            exit 1
          fi

          if ldd dist/tesseract/bin/tesseract | grep -E '/(home|opt)/|vcpkg'; then
            echo "::error::tesseract still links a non-system library - bundle is not self-contained"
            exit 1
          fi

      # Static libraries do not appear in otool -L at all, so a clean bundle
      # lists only /usr/lib/*. A Homebrew path means something was linked
      # dynamically from the build machine.
      - name: Verify self-contained (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Linked libraries:"
          otool -L dist/tesseract/bin/tesseract

          if otool -L dist/tesseract/bin/tesseract | grep -E '/(opt/homebrew|usr/local)/'; then
            echo "::error::tesseract links a Homebrew library - bundle is not self-contained"
            exit 1
          fi

      # ------------------------------------------------------------
      # Archive
      # ------------------------------------------------------------

      - name: Create archive - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/tesseract `
            -DestinationPath "tesseract-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip"

      - name: Create archive - Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf \
            "tesseract-${{ needs.version.outputs.version }}-${{ matrix.platform }}.tar.gz" \
            -C dist \
            tesseract

      # ------------------------------------------------------------
      # Upload build artifact
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tesseract-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz

  # ==============================================================
  # Release
  # ==============================================================
  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: tesseract-${{ needs.version.outputs.version }}-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum \
            *.zip \
            *.tar.gz \
            > SHA256SUMS

          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tesseract-${{ needs.version.outputs.version }}
          name: Tesseract ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
