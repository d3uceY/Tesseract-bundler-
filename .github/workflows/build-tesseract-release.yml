name: Build Tesseract Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tesseract version to build"
        required: true
        default: "5.5.3"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout bundler repo
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v5

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push triggers build the version pinned in TESSERACT_VERSION,
            # not the bundler repo's own tag name.
            echo "version=$(tr -d '[:space:]' < TESSERACT_VERSION)" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            os: windows-2025
            archive: zip

          - platform: linux-amd64
            os: ubuntu-24.04
            archive: tar.gz

          - platform: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar.gz

          # macos-13 was retired by GitHub; a job on a label with no runner
          # queues until the 24h limit instead of failing fast. The supported
          # Intel labels are macos-15-intel / macos-26-intel.
          - platform: macos-amd64
            os: macos-15-intel
            archive: tar.gz

          - platform: macos-arm64
            os: macos-14
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Tesseract
        uses: actions/checkout@v5
        with:
          repository: tesseract-ocr/tesseract
          ref: ${{ needs.version.outputs.version }}
          submodules: recursive

      # ------------------------------------------------------------
      # Windows
      # ------------------------------------------------------------

      # Tesseract does `find_package(Leptonica <ver> CONFIG)`, which only looks
      # at the prefix path the vcpkg toolchain file sets up. That prefix is
      # derived from VCPKG_TARGET_TRIPLET, so the triplet we *install* and the
      # triplet CMake *searches* must be identical. A mismatch is not a
      # "Leptonica missing" problem, it is a "we looked in the wrong triplet
      # directory" problem - the tell-tale is `missing: Leptonica_DIR` in
      # config mode.
      #
      #   leptonica:x64-windows-static  ->  /MT CRT, matches WIN32_MT_BUILD=ON
      #   -A x64                        ->  without it the VS generator can
      #                                     resolve the x86-windows triplet and
      #                                     silently produce a 32-bit build
      - name: Install vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:GITHUB_WORKSPACE\vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkg"
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" `
            install `
            leptonica:x64-windows-static

      - name: Build Tesseract - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg   = "$env:GITHUB_WORKSPACE\vcpkg"
          $prefix  = "$env:GITHUB_WORKSPACE\package"
          $triplet = "x64-windows-static"

          # -A x64 must be given explicitly; the toolchain derives the default
          # triplet from the generator platform, and we only installed one
          # triplet. DISABLE_CURL/ARCHIVE keep the link line free of stray
          # system libraries, which would otherwise turn into runtime DLL deps.
          cmake -S . -B build `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$prefix" `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=$triplet" `
            -DOPENMP_BUILD=OFF `
            -DBUILD_TRAINING_TOOLS=OFF `
            -DBUILD_TESTS=OFF `
            -DDISABLE_CURL=ON `
            -DDISABLE_ARCHIVE=ON `
            -DWIN32_MT_BUILD=ON

          cmake --build build --config Release --parallel --target install

      # ------------------------------------------------------------
      # Unix
      # ------------------------------------------------------------

      - name: Install Unix dependencies
        if: runner.os != 'Windows'
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y \
              cmake \
              ninja-build \
              pkg-config \
              libicu-dev \
              libleptonica-dev \
              libtiff-dev \
              libpng-dev \
              libjpeg-dev \
              libwebp-dev \
              libopenjp2-7-dev \
              zlib1g-dev
          else
            brew update
            brew install cmake leptonica
          fi

      - name: Build Tesseract - Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir build
          cd build

          cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/package" \
            -DOPENMP_BUILD=OFF \
            -DBUILD_TRAINING_TOOLS=OFF \
            -DBUILD_TESTS=OFF \
            -DDISABLE_CURL=ON \
            -DDISABLE_ARCHIVE=ON

          cmake --build . --parallel
          cmake --install .

      # ------------------------------------------------------------
      # Add language data
      # ------------------------------------------------------------

      - name: Download tessdata
        shell: bash
        run: |
          mkdir -p package/tessdata

          curl -L --fail --retry 3 --retry-delay 2 \
            -o package/tessdata/eng.traineddata \
            https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata

          curl -L --fail --retry 3 --retry-delay 2 \
            -o package/tessdata/osd.traineddata \
            https://github.com/tesseract-ocr/tessdata/raw/main/osd.traineddata

      # ------------------------------------------------------------
      # Normalize package layout
      # ------------------------------------------------------------

      - name: Prepare package
        shell: bash
        run: |
          mkdir -p dist/tesseract
          cp -r package/* dist/tesseract/

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Ship a portable runtime, not a dev install: bin/ + tessdata/.
            rm -f dist/tesseract/bin/*.pdb
            rm -rf dist/tesseract/lib dist/tesseract/include

            # A static build must not depend on sibling DLLs, and leptonica
            # lives in a *static* triplet so it cannot leak a DLL in here.
            # If one ever shows up, the "static" assumption has broken and the
            # shipped package would fail on a clean machine.
            dlls=$(find dist/tesseract -iname '*.dll')
            if [[ -n "$dlls" ]]; then
              echo "::error::Unexpected DLLs in the Windows package - build is no longer self-contained:"
              echo "$dlls"
              exit 1
            fi
          fi

          echo "Package contents:"
          find dist/tesseract -maxdepth 3 -type f

      # ------------------------------------------------------------
      # Test
      # ------------------------------------------------------------

      # Runs the binary straight out of the packaged tree. vcpkg's installed
      # bin/ is never on PATH here, so a missing leptonica DLL would fail this
      # step rather than a user's machine.
      - name: Test Tesseract
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./dist/tesseract/bin/tesseract.exe --version
            ./dist/tesseract/bin/tesseract.exe --list-langs \
              --tessdata-dir ./dist/tesseract/tessdata
          else
            ./dist/tesseract/bin/tesseract --version
            ./dist/tesseract/bin/tesseract --list-langs \
              --tessdata-dir ./dist/tesseract/tessdata
          fi

      # ------------------------------------------------------------
      # Archive
      # ------------------------------------------------------------

      - name: Create archive - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/tesseract `
            -DestinationPath "tesseract-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip"

      - name: Create archive - Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf \
            "tesseract-${{ needs.version.outputs.version }}-${{ matrix.platform }}.tar.gz" \
            -C dist \
            tesseract

      # ------------------------------------------------------------
      # Upload build artifact
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: tesseract-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz

  # ==============================================================
  # Release
  # ==============================================================

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: tesseract-${{ needs.version.outputs.version }}-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum \
            *.zip \
            *.tar.gz \
            > SHA256SUMS

          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tesseract-${{ needs.version.outputs.version }}
          name: Tesseract ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
